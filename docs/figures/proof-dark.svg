<text x="128.14" y="190.54" class="t" font-size="14" data-role="statement">tools/prove.py repeats this for all 36 proven</text>
<text x="128.14" y="210.54" class="t" font-size="14" data-role="statement">claims, and the stage fails if one does not hold.</text>
