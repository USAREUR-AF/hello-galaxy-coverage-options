<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 760 248" role="img" aria-label="A proven claim points to an evidence file and a sample message in its owner&#x27;s store; the library decodes the sample or reruns the conversion; the result must equal the kept run file"><style>svg{--ink:#e7e9ec; --quiet:#a5acb7; --rule:#30363e; --line:#7b8592; --paper:#121417; --panel:#1a1d21; --accent:#6cc3da; --accent-soft:#14303a; --on-accent:#121417; --good:#6fc480; --good-bg:#1b2e20; --warn:#e2b04e; --warn-bg:#32291a; --info:#86b3ea; --info-bg:#1a2636; --crit:#f08b80; --crit-bg:#3a1f1f; --mute:#9ba2ac; --mute-bg:#24262b; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.t { fill:var(--ink); } .tq { fill:var(--quiet); } .ta { fill:var(--accent); } .tg { fill:var(--good); }
.tw { fill:var(--warn); } .ti { fill:var(--info); } .tc { fill:var(--crit); } .tm { fill:var(--mute); }
.ton { fill:var(--on-accent); }
.bx { fill:var(--paper); stroke:var(--line); stroke-width:1.25; } .bxp { fill:var(--panel); stroke:var(--rule); stroke-width:1.25; }
.bxa { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.25; } .bxg { fill:var(--good-bg); stroke:var(--good); stroke-width:1.25; }
.bxw { fill:var(--warn-bg); stroke:var(--warn); stroke-width:1.25; } .bxi { fill:var(--info-bg); stroke:var(--info); stroke-width:1.25; }
.bxc { fill:var(--crit-bg); stroke:var(--crit); stroke-width:1.25; } .bxm { fill:var(--mute-bg); stroke:var(--mute); stroke-width:1.25; }
.bxd { fill:var(--paper); stroke:var(--line); stroke-width:1.25; stroke-dasharray:5 4; }
.ln { stroke:var(--line); stroke-width:1.25; fill:none; } .lna { stroke:var(--accent); stroke-width:2; fill:none; }
.lng { stroke:var(--good); stroke-width:2; fill:none; } .lnw { stroke:var(--warn); stroke-width:2; fill:none; }
.lnd { stroke:var(--line); stroke-width:1.25; fill:none; stroke-dasharray:6 5; }
.lno { stroke:var(--good); stroke-width:2; fill:none; stroke-dasharray:2 5; stroke-linecap:round; }
.lnr { stroke:var(--rule); stroke-width:1; fill:none; }
.lnx { stroke:var(--crit); stroke-width:2; fill:none; stroke-dasharray:3 6; }
.fa { fill:var(--accent); } .fg { fill:var(--good); } .fl { fill:var(--line); } .fw { fill:var(--warn); }
.fi { fill:var(--info); } .fc { fill:var(--crit); } .fm { fill:var(--mute); } .fp { fill:var(--panel); }
.fs { fill:var(--accent-soft); }
.halo { paint-order:stroke fill; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round; }
.halo.on-panel { stroke:var(--panel); }</style>
<text x="20" y="36" class="t" font-size="18" font-weight="700" data-role="title">A claim is proven only when a run backs it</text>
